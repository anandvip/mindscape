                },

                analytics() {
                    const stats = analytics.getStats();
                    const mostActive = analytics.getMostActive();
                    const emotionData = analytics.getEmotionBreakdown();

                    return {
                        title: '&#128202; Analytics',
                        content: `
                            <div class="analytics-grid">
                                <div class="stat-card">
                                    <div class="stat-card__value">${stats.totalPatterns}</div>
                                    <div class="stat-card__label">Active Patterns</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-card__value">${stats.totalEncounters}</div>
                                    <div class="stat-card__label">Total Encounters</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-card__value">${stats.todayEncounters}</div>
                                    <div class="stat-card__label">Today</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-card__value">${stats.weekEncounters}</div>
                                    <div class="stat-card__label">This Week</div>
                                </div>
                            </div>
                            
                            ${mostActive.length > 0 ? `
                                <div class="form-section" style="margin-bottom: 16px;">
                                    <h4 style="margin-bottom: 12px;">Most Active Patterns</h4>
                                    ${mostActive.map(({ pattern, count }) => `
                                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                            <span>${sanitize(pattern?.text || 'Unknown')}</span>
                                            <strong>${count}</strong>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            
                            ${emotionData.length > 0 ? `
                                <div class="form-section">
                                    <h4 style="margin-bottom: 12px;">Emotion Distribution</h4>
                                    ${emotionData.map(({ emotion, count, percentage }) => `
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                            <div style="display: flex; align-items: center; gap: 8px;">
                                                <div style="width: 12px; height: 12px; background: ${emotion?.color}; border-radius: 50%;"></div>
                                                <span>${sanitize(emotion?.name || 'Unknown')}</span>
                                            </div>
                                            <span>${count} (${percentage}%)</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        `
                    };
                },

                palette() {
                    return {
                        title: '&#127912; Emotion Palette',
                        content: `
                            <div class="form-section" style="margin-bottom: 16px;">
                                <h4 style="margin-bottom: 12px;">Add New Emotion</h4>
                                <div style="display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-bottom: 12px;">
                                    <input type="text" id="emotion-name" class="input" placeholder="Emotion name..." maxlength="30">
                                    <input type="color" id="emotion-color" value="#888888" style="width: 50px; height: 46px; border: none; border-radius: 4px; cursor: pointer;">
                                </div>
                                <button class="btn btn--primary" data-action="add-emotion">Add Emotion</button>
                            </div>
                            
                            <div class="form-section">
                                <h4 style="margin-bottom: 12px;">Your Emotions</h4>
                                ${state.userEmotions.map(emo => `
                                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 6px; margin-bottom: 8px;">
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            <div style="width: 16px; height: 16px; background: ${emo.color}; border-radius: 4px;"></div>
                                            <span>${sanitize(emo.name)}</span>
                                        </div>
                                        ${emo.id !== 'default' ? `<button class="btn btn--danger btn--sm" data-action="delete-emotion" data-id="${emo.id}">&#10005;</button>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `
                    };
                },

                archive() {
                    const retired = state.patterns.filter(p => p.status === 'retired');
                    return {
                        title: '&#128218; Pattern Archive',
                        content: `
                            <div class="form-section">
                                <p style="color: var(--text-secondary); margin-bottom: 16px;">Patterns you've resolved. A testament to your growth.</p>
                                ${retired.length > 0 ? retired.map(p => `
                                    <div style="padding: 16px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 12px;">
                                        <div style="font-weight: 600; margin-bottom: 4px;">${sanitize(p.text)}</div>
                                        <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px;">
                                            Original: "${sanitize(p.originalText)}"
                                        </div>
                                        <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 12px;">
                                            Retired: ${p.retiredAt ? formatDate(p.retiredAt) : 'Unknown'}
                                        </div>
                                        <button class="btn btn--secondary btn--sm" data-action="reactivate-pattern" data-id="${p.id}">&#128196; Reactivate</button>
                                    </div>
                                `).join('') : templates.emptyState('No retired patterns yet.', '&#127793;')}
                            </div>
                        `
                    };
                },

                dailyReport() {
                    const today = new Date().toISOString().split('T')[0];
                    const todayEncounters = state.encounters.filter(e => e.timestamp.startsWith(today));
                    const flagged = state.encounters.filter(e => e.flagged);
                    const intentions = state.reflections.filter(r => r.type === 'intention').slice(-5).reverse();

                    return {
                        title: '&#128221; Daily Report',
                        content: `
                            <div class="analytics-grid" style="margin-bottom: 16px;">
                                <div class="stat-card">
                                    <div class="stat-card__value">${todayEncounters.length}</div>
                                    <div class="stat-card__label">Today</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-card__value">${flagged.length}</div>
                                    <div class="stat-card__label">Flagged</div>
                                </div>
                            </div>
                            
                            ${flagged.length > 0 ? `
                                <div class="form-section" style="margin-bottom: 16px;">
                                    <h4 style="margin-bottom: 12px;">&#128681; Flagged for Review</h4>
                                    ${flagged.slice(0, 5).map(enc => {
                                        const pattern = state.patterns.find(p => p.id === enc.patternId);
                                        return `
                                            <div style="padding: 12px; background: rgba(255, 215, 0, 0.1); border-left: 3px solid var(--warning); border-radius: 6px; margin-bottom: 8px;">
                                                <div style="font-weight: 600; margin-bottom: 4px;">${sanitize(pattern?.text || 'Unknown')}</div>
                                                <div style="font-size: 0.85rem; font-style: italic; color: var(--text-secondary);">"${sanitize(enc.journal || 'No journal')}"</div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            ` : ''}
                            
                            ${intentions.length > 0 ? `
                                <div class="form-section" style="margin-bottom: 16px;">
                                    <h4 style="margin-bottom: 12px;">&#127919; Recent Intentions</h4>
                                    ${intentions.map(int => `
                                        <div style="padding: 10px; background: rgba(138, 43, 226, 0.1); border-left: 3px solid var(--thought-purple); border-radius: 6px; margin-bottom: 8px;">
                                            <div style="font-size: 0.9rem;">"${sanitize(int.text)}"</div>
                                            <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 4px;">${formatDate(int.timestamp)}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            
                            <div class="form-section">
                                <h4 style="margin-bottom: 12px;">Set New Intention</h4>
                                <textarea id="intention-input" class="input input--textarea" placeholder="What would you like to focus on?"></textarea>
                                <button class="btn btn--primary" style="margin-top: 12px;" data-action="save-intention">&#128171; Log Intention</button>
                            </div>
                        `
                    };
                },

                confirmDelete(type, id, message) {
                    return {
                        title: `&#128465; Delete ${type}`,
                        content: `
                            <div class="form-section">
                                <p style="margin-bottom: 16px;">${message}</p>
                                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                                    <button class="btn btn--secondary" data-action="close-modal">Cancel</button>
                                    <button class="btn btn--danger" data-action="confirm-delete-${type.toLowerCase()}" data-id="${id}">&#128465; Delete</button>
                                </div>
                            </div>
                        `
                    };
                }
            };

            // ================================================================
            // Render Functions
            // ================================================================
            const renderPatterns = () => {
                const active = state.patterns.filter(p => p.status === 'active');
                
                if (active.length === 0) {
                    return templates.emptyState('Add a recurring thought above to begin your journey of self-awareness.', '&#129504;');
                }

                return active.map(p => templates.patternCard(p, p.id === state.ui.focusedPatternId)).join('');
            };

            const renderEncounters = () => {
                let encounters = [...state.encounters];

                // Sort focused pattern encounters to top
                if (state.ui.focusedPatternId) {
                    encounters.sort((a, b) => {
                        const aFocused = a.patternId === state.ui.focusedPatternId ? 1 : 0;
                        const bFocused = b.patternId === state.ui.focusedPatternId ? 1 : 0;
                        return bFocused - aFocused;
                    });
                }

                if (encounters.length === 0) {
                    return templates.emptyState('Log an encounter to see it here.', '&#10024;');
                }

                return encounters.slice(0, 50).map(e => templates.encounterCard(e)).join('');
            };

            // Main render function - DEBOUNCED to prevent jitter
            const render = debounce(() => {
                requestAnimationFrame(() => {
                    if (dom.patternsCarousel) {
                        dom.patternsCarousel.innerHTML = renderPatterns();
                    }
                    if (dom.encountersCarousel) {
                        dom.encountersCarousel.innerHTML = renderEncounters();
                    }
                    updateCharCounter();
                });
            }, CONFIG.DEBOUNCE_DELAY);

            const updateCharCounter = () => {
                const input = dom.patternInput;
                const counter = document.getElementById('char-count');
                if (input && counter) {
                    counter.textContent = input.value.length;
                    counter.style.color = input.value.length > CONFIG.MAX_INPUT_LENGTH * 0.8 
                        ? 'var(--warning)' 
                        : 'var(--text-secondary)';
                }
            };

            // ================================================================
            // Event Handlers (Delegated)
            // ================================================================
            const handlers = {
                'add-pattern': () => {
                    if (dom.patternInput && actions.addPattern(dom.patternInput.value)) {
                        dom.patternInput.value = '';
                        updateCharCounter();
                    }
                },

                'focus-pattern': (e) => {
                    const card = e.target.closest('[data-id]');
                    if (card) actions.setFocusedPattern(card.dataset.id);
                },

                'log-encounter': (e) => {
                    const id = e.target.dataset.id;
                    const pattern = state.patterns.find(p => p.id === id);
                    if (pattern) {
                        modal.open({
                            ...modalTemplates.logEncounter(pattern),
                            onOpen: (el) => {
                                // Auto-select first context and emotion
                                const ctx = el.querySelector('[data-action="select-context"]');
                                const emo = el.querySelector('[data-action="select-emotion"]');
                                if (ctx) ctx.classList.add('is-active');
                                if (emo) emo.classList.add('is-active');
                            }
                        });
                    }
                },

                'review-pattern': (e) => {
                    const pattern = state.patterns.find(p => p.id === e.target.dataset.id);
                    if (pattern) modal.open(modalTemplates.reviewPattern(pattern));
                },

                'evolve-pattern': (e) => {
                    const input = document.getElementById('evolve-input');
                    if (input && actions.evolvePattern(e.target.dataset.id, input.value)) {
                        modal.close();
                    }
                },

                'retire-pattern': (e) => {
                    if (actions.retirePattern(e.target.dataset.id)) {
                        modal.closeAll();
                    }
                },

                'reactivate-pattern': (e) => {
                    if (actions.reactivatePattern(e.target.dataset.id)) {
                        modal.close();
                        modal.open(modalTemplates.archive());
                    }
                },

                'submit-encounter': (e) => {
                    const patternId = e.target.dataset.patternId;
                    const encounterId = e.target.dataset.encounterId;

                    const activeContext = document.querySelector('.choice-option[data-action="select-context"].is-active');
                    const activeEmotion = document.querySelector('.choice-option[data-action="select-emotion"].is-active');

                    const context = activeContext?.dataset.value || 'General';
                    const emotionId = activeEmotion?.dataset.value || 'default';

                    let success;
                    if (encounterId) {
                        success = actions.updateEncounter(encounterId, { context, emotionId });
                    } else {
                        success = actions.logEncounter(patternId, context, emotionId);
                    }

                    if (success) modal.close();
                },

                'edit-encounter': (e) => {
                    const encounter = state.encounters.find(enc => enc.id === e.target.dataset.id);
                    const pattern = state.patterns.find(p => p.id === encounter?.patternId);
                    if (encounter && pattern) {
                        modal.open(modalTemplates.logEncounter(pattern, encounter));
                    }
                },

                'delete-encounter': (e) => {
                    const encounter = state.encounters.find(enc => enc.id === e.target.dataset.id);
                    const pattern = state.patterns.find(p => p.id === encounter?.patternId);
                    modal.open(modalTemplates.confirmDelete(
                        'Encounter',
                        e.target.dataset.id,
                        `Delete this encounter with "${sanitize(pattern?.text || 'Unknown')}"?`
                    ));
                },

                'confirm-delete-encounter': (e) => {
                    if (actions.deleteEncounter(e.target.dataset.id)) {
                        modal.close();
                    }
                },

                'toggle-flag': (e) => actions.toggleFlag(e.target.dataset.id),

                'open-journal': (e) => {
                    const encounter = state.encounters.find(enc => enc.id === e.target.dataset.id);
                    if (encounter) modal.open(modalTemplates.journal(encounter));
                },

                'save-journal': (e) => {
                    const input = document.getElementById('journal-input');
                    if (input && actions.saveJournal(e.target.dataset.id, input.value)) {
                        modal.close();
                    }
                },

                'select-context': (e) => {
                    document.querySelectorAll('[data-action="select-context"]').forEach(el => el.classList.remove('is-active'));
                    e.target.classList.add('is-active');
                },

                'select-emotion': (e) => {
                    document.querySelectorAll('[data-action="select-emotion"]').forEach(el => el.classList.remove('is-active'));
                    e.target.classList.add('is-active');
                },

                'show-help': () => modal.open(modalTemplates.help()),
                'show-analytics': () => modal.open(modalTemplates.analytics()),
                'show-archive': () => modal.open(modalTemplates.archive()),
                'show-palette': () => modal.open(modalTemplates.palette()),
                'show-report': () => modal.open(modalTemplates.dailyReport()),

                'close-modal': () => modal.close(),
                'modal-backdrop-click': (e) => {
                    if (e.target.classList.contains('modal-backdrop')) modal.close();
                },

                'add-emotion': () => {
                    const name = document.getElementById('emotion-name');
                    const color = document.getElementById('emotion-color');
                    if (name && color && actions.addEmotion(name.value, color.value)) {
                        modal.close();
                        modal.open(modalTemplates.palette());
                    }
                },

                'delete-emotion': (e) => {
                    const emotion = state.userEmotions.find(emo => emo.id === e.target.dataset.id);
                    modal.open(modalTemplates.confirmDelete(
                        'Emotion',
                        e.target.dataset.id,
                        `Delete "${sanitize(emotion?.name || 'Unknown')}"? Encounters will be set to Neutral.`
                    ));
                },

                'confirm-delete-emotion': (e) => {
                    if (actions.deleteEmotion(e.target.dataset.id)) {
                        modal.close();
                        modal.open(modalTemplates.palette());
                    }
                },

                'save-intention': () => {
                    const input = document.getElementById('intention-input');
                    if (input && actions.saveIntention(input.value)) {
                        modal.close();
                    }
                },

                'export-data': () => storage.export(),

                'import-data': () => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = (e) => {
                        if (e.target.files[0]) storage.import(e.target.files[0]);
                    };
                    input.click();
                }
            };

            // ================================================================
            // Event Listeners Setup
            // ================================================================
            const setupEventListeners = () => {
                // Delegated click handler
                document.body.addEventListener('click', (e) => {
                    // Don't intercept native form inputs (color picker, file input, etc.)
                    const clickedInput = e.target.closest('input, select, textarea');
                    if (clickedInput && !clickedInput.dataset.action) return;
                    
                    const target = e.target.closest('[data-action]');
                    if (target && handlers[target.dataset.action]) {
                        e.preventDefault();
                        handlers[target.dataset.action](e);
                    }
                });

                // Keyboard handlers
                document.body.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && state.ui.modalStack.length > 0) {
                        modal.close();
                        return;
                    }

                    if (e.key === 'Enter' && e.target.id === 'pattern-input') {
                        e.preventDefault();
                        handlers['add-pattern']();
                    }
                });

                // Input counter
                dom.app.addEventListener('input', (e) => {
                    if (e.target.id === 'pattern-input') {
                        updateCharCounter();
                    }
                });
            };

            // ================================================================
            // IntersectionObserver for Pattern Focus (DEBOUNCED)
            // ================================================================
            let observer = null;
            const setupPatternObserver = debounce(() => {
                if (observer) observer.disconnect();

                const carousel = dom.patternsCarousel;
                if (!carousel || window.innerWidth >= 1024) return; // Only on mobile/tablet

                const cards = carousel.querySelectorAll('.card--pattern');
                if (cards.length === 0) return;

                observer = new IntersectionObserver(
                    debounce((entries) => {
                        let mostVisible = null;
                        let maxRatio = 0;

                        entries.forEach(entry => {
                            if (entry.isIntersecting && entry.intersectionRatio > maxRatio) {
                                maxRatio = entry.intersectionRatio;
                                mostVisible = entry.target.dataset.id;
                            }
                        });

                        if (mostVisible && mostVisible !== state.ui.focusedPatternId) {
                            state.ui.focusedPatternId = mostVisible;
                            render();
                        }
                    }, 50),
                    {
                        root: carousel,
                        threshold: [0.5, 0.75, 1.0]
                    }
                );

                cards.forEach(card => observer.observe(card));
            }, 200);

            // ================================================================
            // Initialization
            // ================================================================
            const init = () => {
                // Get DOM references
                dom.app = document.getElementById('app');
                dom.modalRoot = document.getElementById('modal-root');
                dom.toastRoot = document.getElementById('toast-root');

                // Load saved state
                storage.load();

                // Render main template
                dom.app.innerHTML = templates.main();

                // Get dynamic references
                dom.patternInput = document.getElementById('pattern-input');
                dom.patternsCarousel = document.getElementById('patterns-carousel');
                dom.encountersCarousel = document.getElementById('encounters-carousel');

                // Setup event listeners
                setupEventListeners();

                // Initial render
                render();

                // Setup observer after render
                requestAnimationFrame(setupPatternObserver);

                // Re-setup observer on resize
                window.addEventListener('resize', debounce(setupPatternObserver, 300));

                // Auto-save
                setInterval(() => storage.save(), CONFIG.AUTO_SAVE_INTERVAL);

                // Welcome message for new users
                if (state.patterns.length === 0 && state.encounters.length === 0) {
                    setTimeout(() => toast.info('Welcome to Mindscape! Add a pattern to begin.'), 1000);
                }

                console.log('&#129504; Mindscape v3.0 initialized');
            };

            // Cleanup on unload
            window.addEventListener('beforeunload', () => {
                storage.save();
                if (observer) observer.disconnect();
            });

            // Start app
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
